# Unsuppressed OSV watch for Chroma HTTP-server RCEs (CVE-2026-45829 / 45833).
# PR/release CI still ignores those IDs (embedded PersistentClient only).
# This job is scheduled so a patched chromadb release cannot sit unnoticed.
# Actions are pinned to full commit SHAs (immutable).

name: Advisory watch

on:
  schedule:
    # Monday 06:00 UTC — independent of PR/release gates.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chroma-osv:
    name: Unsuppressed Chroma / pip-audit watch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project (locked)
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install -e ".[dev]" -c constraints.txt
          python -m pip install -q pip-audit

      - name: Unsuppressed advisory watch
        run: |
          set -euo pipefail
          python scripts/chroma-advisory-watch.py
