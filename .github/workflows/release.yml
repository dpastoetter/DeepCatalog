# Release pipeline: quality → security (audit/secrets/SAST) → AppImage → publish.
# Actions are pinned to full commit SHAs (see CI workflow for the same pins).
#
# Triggers:
#   - push of a v* tag (git tag && git push --tags)
#   - publishing a GitHub Release (UI or gh release create)
#   - workflow_dispatch with an explicit tag (rebuild / attach assets)
#
# GITHUB_TOKEN creating a release does not re-fire this workflow (GitHub loop guard).
# A UI publish of a tag that already has an AppImage asset is skipped.

name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to pack and publish (e.g. v0.3.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Default deny write; only the publish job elevates.
permissions:
  contents: read

jobs:
  context:
    name: Resolve release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      pack: ${{ steps.resolve.outputs.pack }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          TAG_PUSH: ${{ github.ref_name }}
          TAG_RELEASE: ${{ github.event.release.tag_name }}
          TAG_INPUT: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            release) TAG="$TAG_RELEASE" ;;
            workflow_dispatch) TAG="$TAG_INPUT" ;;
            *) TAG="$TAG_PUSH" ;;
          esac
          TAG="${TAG#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Refusing to pack a non-version tag: ${TAG}" >&2
            exit 1
          fi
          PACK=true
          # Live check so a queued duplicate (tag push + UI publish) does not rebuild.
          # workflow_dispatch always packs so a broken asset can be replaced.
          if [ "$EVENT" != "workflow_dispatch" ] && gh release view "$TAG" >/dev/null 2>&1; then
            assets="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(",")')"
            if echo "${assets:-}" | grep -q '\.AppImage'; then
              echo "Release ${TAG} already has an AppImage — skipping duplicate pack"
              PACK=false
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "pack=${PACK}" >> "$GITHUB_OUTPUT"
          echo "event=${EVENT} tag=${TAG} pack=${PACK}"

  quality:
    name: Quality gate (tagged commit)
    needs: [context]
    if: needs.context.outputs.pack == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.context.outputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.context.outputs.tag }}

      - name: Verify tag points at checked-out commit
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          CHECKOUT="$(git rev-parse HEAD)"
          TAGGED="$(git rev-parse "${TAG}^{commit}")"
          echo "checkout=${CHECKOUT}"
          echo "tag=${TAG} → ${TAGGED}"
          if [ "$CHECKOUT" != "$TAGGED" ]; then
            echo "Checked-out commit does not match tag ${TAG}" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node (JS syntax + Vitest)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install Poppler (PDF render tests)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install -e ".[dev]" -c constraints.txt
          npm ci

      - name: Run quality gate
        run: |
          set -euo pipefail
          chmod +x scripts/ci.sh
          ./scripts/ci.sh

  security:
    name: Security scans (tagged commit)
    needs: [context]
    if: needs.context.outputs.pack == 'true'
    uses: ./.github/workflows/security.yml
    with:
      checkout_ref: ${{ needs.context.outputs.tag }}
    permissions:
      contents: read
      security-events: write

  appimage:
    name: Linux AppImage (x86_64)
    needs: [context, quality, security]
    if: needs.context.outputs.pack == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.context.outputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ needs.context.outputs.tag }}

      - name: Verify tag points at checked-out commit
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          CHECKOUT="$(git rev-parse HEAD)"
          TAGGED="$(git rev-parse "${TAG}^{commit}")"
          echo "checkout=${CHECKOUT}"
          echo "tag=${TAG} → ${TAGGED}"
          if [ "$CHECKOUT" != "$TAGGED" ]; then
            echo "Checked-out commit does not match tag ${TAG}" >&2
            exit 1
          fi

      - name: Install Poppler, WebKitGTK, and AppImage build deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            poppler-utils patchelf gcc pkg-config meson ninja-build file \
            libgirepository1.0-dev libcairo2-dev gobject-introspection \
            gir1.2-gtk-3.0 libgtk-3-0 libffi-dev \
            adwaita-icon-theme gnome-themes-extra librsvg2-common \
            libgdk-pixbuf2.0-bin libgdk-pixbuf2.0-dev
          if ! sudo apt-get install -y -qq libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1; then
            sudo apt-get install -y -qq libwebkit2gtk-4.0-37 libwebkit2gtk-4.0-dev gir1.2-webkit2-4.0
          fi

      - name: Build AppImage
        run: |
          set -euo pipefail
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh "${RELEASE_TAG}"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-appimage
          path: |
            dist/DeepCatalog-*-x86_64.AppImage
            dist/DeepCatalog-*-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [context, quality, security, appimage]
    if: needs.context.outputs.pack == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.context.outputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the tag resolves cleanly and git archive sees every path.
          fetch-depth: 0
          ref: ${{ needs.context.outputs.tag }}

      - name: Verify tag points at checked-out commit
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          CHECKOUT="$(git rev-parse HEAD)"
          TAGGED="$(git rev-parse "${TAG}^{commit}")"
          echo "checkout=${CHECKOUT}"
          echo "tag=${TAG} → ${TAGGED}"
          if [ "$CHECKOUT" != "$TAGGED" ]; then
            echo "Checked-out commit does not match tag ${TAG}" >&2
            exit 1
          fi
          git log -1 --oneline HEAD
          echo "Tracked files: $(git ls-tree -r --name-only HEAD | wc -l)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build release assets
        run: |
          set -euo pipefail
          chmod +x scripts/make-release-assets.sh
          ./scripts/make-release-assets.sh "${RELEASE_TAG}"
          # Confirm the packed commit matches this tag.
          grep -F "commit=$(git rev-parse HEAD)" dist/stage/deepcatalog-*/.release-commit
          # Sanity: archive must contain every currently tracked path we care about.
          tar -tzf dist/deepcatalog-*.tar.gz | grep -E 'deepcatalog/system_service\.py$'
          tar -tzf dist/deepcatalog-*.tar.gz | grep -E 'app/static/app\.js$'
          tar -tzf dist/deepcatalog-*.tar.gz | grep -E 'packaging/linux/AppRun$'
          tar -tzf dist/deepcatalog-*.tar.gz | grep -E '\.release-commit$'
          tar -tzf dist/deepcatalog-*.tar.gz | grep -E '\.release-files$'
          cat dist/stage/deepcatalog-*/.release-commit

      - name: Download AppImage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-appimage
          path: /tmp/linux-appimage

      - name: Attach AppImage to checksums
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          APPIMAGE="DeepCatalog-${VERSION}-x86_64.AppImage"
          found="$(find /tmp/linux-appimage -name "${APPIMAGE}" -print -quit)"
          if [ -z "$found" ]; then
            echo "AppImage artifact missing: ${APPIMAGE}" >&2
            find /tmp/linux-appimage -type f >&2 || true
            exit 1
          fi
          cp "$found" "dist/${APPIMAGE}"
          test -f "dist/${APPIMAGE}"
          (
            cd dist
            sha256sum "${APPIMAGE}" >> SHA256SUMS
          )
          grep -F "${APPIMAGE}" dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          COMMIT="$(git rev-parse HEAD)"
          COMMIT_SHORT="$(git rev-parse --short=12 HEAD)"
          FILE_COUNT="$(git ls-tree -r --name-only HEAD | wc -l | tr -d ' ')"

          cat > /tmp/release-notes.md <<EOF
          ## DeepCatalog ${TAG}

          Built from commit \`${COMMIT_SHORT}\` (\`${COMMIT}\`) — ${FILE_COUNT} tracked files packed into the release archive.

          ### Assets
          - \`deepcatalog-${VERSION}.tar.gz\` — full source archive for the in-app updater (SHA-256 verified)
          - \`DeepCatalog-${VERSION}-x86_64.AppImage\` — Linux x86_64 desktop AppImage (glibc 2.35+)
          - \`install.sh\` — Linux/macOS one-line installer bootstrap
          - \`install.ps1\` — Windows PowerShell one-line installer bootstrap
          - \`SHA256SUMS\` — checksums

          ### Install
          Linux AppImage:
          \`\`\`bash
          curl -fsSL -o DeepCatalog.AppImage \\
            https://github.com/dpastoetter/DeepCatalog/releases/latest/download/DeepCatalog-${VERSION}-x86_64.AppImage
          chmod +x DeepCatalog.AppImage
          ./DeepCatalog.AppImage
          \`\`\`

          Linux / macOS (source + venv):
          \`\`\`bash
          curl -fsSL https://github.com/dpastoetter/DeepCatalog/releases/latest/download/install.sh | bash
          \`\`\`

          Windows (PowerShell):
          \`\`\`powershell
          irm https://github.com/dpastoetter/DeepCatalog/releases/latest/download/install.ps1 | iex
          \`\`\`
          EOF
          # Strip the common leading indent from the heredoc body.
          sed -i 's/^          //' /tmp/release-notes.md

          ASSETS=(dist/deepcatalog-"${VERSION}".tar.gz dist/DeepCatalog-"${VERSION}"-x86_64.AppImage dist/install.sh dist/install.ps1 dist/SHA256SUMS)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file /tmp/release-notes.md --target "$COMMIT"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              --target "$COMMIT"
          fi
