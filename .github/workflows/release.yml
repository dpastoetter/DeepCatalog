# Official assets are produced only by this workflow after quality + security.
# Actions are pinned to full commit SHAs (see CI workflow for the same pins).
#
# Triggers (always run the full gated pipeline — never skip because assets exist):
#   - push of a v* tag (git tag && git push --tags) — intended path
#   - release published by a human/PAT — rebuilds and *replaces* any UI-uploaded assets
#   - workflow_dispatch from the tag ref (not a branch) — rebuild
#
# GITHUB_TOKEN creating a release does not re-fire this workflow (GitHub loop guard).
#
# Repo settings that are not expressible here (configure once):
#   Environment "official-release": required reviewers; deployment tags v[0-9]*
#   Prefer DEEPCATALOG_RELEASE_SIGNING_KEY as an environment secret on that env
#   Ruleset on refs/tags/v*: block force-push/delete; restrict who can create tags

name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rebuild (must match the selected workflow tag ref)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Default deny write; only the publish job elevates.
permissions:
  contents: read

jobs:
  context:
    name: Resolve release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          TAG_PUSH: ${{ github.ref_name }}
          TAG_RELEASE: ${{ github.event.release.tag_name }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            release) TAG="$TAG_RELEASE" ;;
            workflow_dispatch) TAG="$TAG_INPUT" ;;
            push) TAG="$TAG_PUSH" ;;
            *)
              echo "Unsupported event: ${EVENT}" >&2
              exit 1
              ;;
          esac
          TAG="${TAG#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Refusing to pack a non-version tag: ${TAG}" >&2
            exit 1
          fi
          # The workflow YAML and sources must come from the tag being released.
          # Dispatching from a branch with a modified pipeline cannot retarget a tag.
          EXPECTED="refs/tags/${TAG}"
          if [ "${GITHUB_REF}" != "${EXPECTED}" ]; then
            echo "Release workflow must run on ${EXPECTED} (got ${GITHUB_REF})." >&2
            echo "For workflow_dispatch, choose that tag under 'Use workflow from'." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "event=${EVENT} tag=${TAG} ref=${GITHUB_REF}"

  quality:
    name: Quality gate (tagged commit)
    needs: [context]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.context.outputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.context.outputs.tag }}

      - name: Verify tag points at checked-out commit
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          CHECKOUT="$(git rev-parse HEAD)"
          TAGGED="$(git rev-parse "${TAG}^{commit}")"
          echo "checkout=${CHECKOUT}"
          echo "tag=${TAG} → ${TAGGED}"
          if [ "$CHECKOUT" != "$TAGGED" ]; then
            echo "Checked-out commit does not match tag ${TAG}" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node (JS syntax + Vitest)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install Poppler (PDF render tests)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install -e ".[dev]" -c constraints.txt
          npm ci

      - name: Run quality gate
        run: |
          set -euo pipefail
          chmod +x scripts/ci.sh
          ./scripts/ci.sh

  security:
    name: Security scans (tagged commit)
    needs: [context]
    uses: ./.github/workflows/security.yml
    with:
      checkout_ref: ${{ needs.context.outputs.tag }}
    permissions:
      contents: read
      security-events: write

  appimage:
    name: Linux AppImage (x86_64)
    needs: [context, quality, security]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.context.outputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.context.outputs.tag }}

      - name: Verify tag points at checked-out commit
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          CHECKOUT="$(git rev-parse HEAD)"
          TAGGED="$(git rev-parse "${TAG}^{commit}")"
          echo "checkout=${CHECKOUT}"
          echo "tag=${TAG} → ${TAGGED}"
          if [ "$CHECKOUT" != "$TAGGED" ]; then
            echo "Checked-out commit does not match tag ${TAG}" >&2
            exit 1
          fi

      - name: Install Poppler, WebKitGTK, and AppImage build deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            poppler-utils patchelf gcc pkg-config meson ninja-build file \
            libgirepository1.0-dev libcairo2-dev gobject-introspection \
            gir1.2-gtk-3.0 libgtk-3-0 libffi-dev \
            adwaita-icon-theme gnome-themes-extra librsvg2-common \
            libgdk-pixbuf2.0-bin libgdk-pixbuf2.0-dev
          if ! sudo apt-get install -y -qq libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1; then
            sudo apt-get install -y -qq libwebkit2gtk-4.0-37 libwebkit2gtk-4.0-dev gir1.2-webkit2-4.0
          fi

      - name: Build AppImage
        run: |
          set -euo pipefail
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh "${RELEASE_TAG}"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-appimage
          path: |
            dist/DeepCatalog-*-x86_64.AppImage
            dist/DeepCatalog-*-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [context, quality, security, appimage]
    runs-on: ubuntu-latest
    environment:
      name: official-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.context.outputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the tag resolves cleanly and git archive sees every path.
          fetch-depth: 0
          ref: ${{ needs.context.outputs.tag }}

      - name: Verify tag points at checked-out commit
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          CHECKOUT="$(git rev-parse HEAD)"
          TAGGED="$(git rev-parse "${TAG}^{commit}")"
          echo "checkout=${CHECKOUT}"
          echo "tag=${TAG} → ${TAGGED}"
          if [ "$CHECKOUT" != "$TAGGED" ]; then
            echo "Checked-out commit does not match tag ${TAG}" >&2
            exit 1
          fi
          git log -1 --oneline HEAD
          echo "Tracked files: $(git ls-tree -r --name-only HEAD | wc -l)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build release assets
        run: |
          set -euo pipefail
          chmod +x scripts/make-release-assets.sh
          ./scripts/make-release-assets.sh "${RELEASE_TAG}"
          # Confirm the packed commit matches this tag.
          grep -F "commit=$(git rev-parse HEAD)" dist/stage/deepcatalog-*/.release-commit
          # Sanity: archive must contain every currently tracked path we care about.
          tar -tzf dist/deepcatalog-*.tar.gz | grep -E 'deepcatalog/system_service\.py$'
          tar -tzf dist/deepcatalog-*.tar.gz | grep -E 'app/static/app\.js$'
          tar -tzf dist/deepcatalog-*.tar.gz | grep -E 'packaging/linux/AppRun$'
          tar -tzf dist/deepcatalog-*.tar.gz | grep -E '\.release-commit$'
          tar -tzf dist/deepcatalog-*.tar.gz | grep -E '\.release-files$'
          cat dist/stage/deepcatalog-*/.release-commit

      - name: Download AppImage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-appimage
          path: /tmp/linux-appimage

      - name: Attach AppImage to checksums
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          APPIMAGE="DeepCatalog-${VERSION}-x86_64.AppImage"
          found="$(find /tmp/linux-appimage -name "${APPIMAGE}" -print -quit)"
          if [ -z "$found" ]; then
            echo "AppImage artifact missing: ${APPIMAGE}" >&2
            find /tmp/linux-appimage -type f >&2 || true
            exit 1
          fi
          cp "$found" "dist/${APPIMAGE}"
          test -f "dist/${APPIMAGE}"
          (
            cd dist
            sha256sum "${APPIMAGE}" >> SHA256SUMS
          )
          grep -F "${APPIMAGE}" dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Sign release manifest
        env:
          DEEPCATALOG_RELEASE_SIGNING_KEY: ${{ secrets.DEEPCATALOG_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPCATALOG_RELEASE_SIGNING_KEY:-}" ]; then
            echo "DEEPCATALOG_RELEASE_SIGNING_KEY secret is required to publish a signed release." >&2
            echo "This must be a separately protected Ed25519 key — not GITHUB_TOKEN." >&2
            exit 1
          fi
          python -m pip install -U pip
          pip install -c constraints.txt cryptography
          python scripts/sign-release-manifest.py dist \
            --tag "${RELEASE_TAG}" \
            --commit "$(git rev-parse HEAD)"
          test -s dist/release-manifest.json
          test -s dist/release-manifest.json.sig

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/deepcatalog-*.tar.gz
            dist/DeepCatalog-*-x86_64.AppImage
            dist/release-manifest.json
            dist/release-manifest.json.sig
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          COMMIT="$(git rev-parse HEAD)"
          COMMIT_SHORT="$(git rev-parse --short=12 HEAD)"
          FILE_COUNT="$(git ls-tree -r --name-only HEAD | wc -l | tr -d ' ')"

          cat > /tmp/release-notes.md <<EOF
          ## DeepCatalog ${TAG}

          Built from commit \`${COMMIT_SHORT}\` (\`${COMMIT}\`) — ${FILE_COUNT} tracked files packed into the release archive.

          ### Assets
          - \`deepcatalog-${VERSION}.tar.gz\` — full source archive for the in-app updater
          - \`DeepCatalog-${VERSION}-x86_64.AppImage\` — Linux x86_64 desktop AppImage (glibc 2.35+)
          - \`release-manifest.json\` / \`release-manifest.json.sig\` — Ed25519-signed artifact list (tag + commit bound)
          - \`install.sh\` — Linux/macOS one-line installer bootstrap
          - \`install.ps1\` — Windows PowerShell one-line installer bootstrap
          - \`SHA256SUMS\` — checksums (not authentic on their own)

          In-app updates require the signed manifest. Independently verify GitHub artifact attestations for *each* asset (tarball, AppImage, installers, manifest, checksums):

          \`\`\`bash
          gh attestation verify deepcatalog-${VERSION}.tar.gz \\
            --repo dpastoetter/DeepCatalog \\
            --cert-identity https://github.com/dpastoetter/DeepCatalog/.github/workflows/release.yml \\
            --cert-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify install.sh \\
            --repo dpastoetter/DeepCatalog \\
            --cert-identity https://github.com/dpastoetter/DeepCatalog/.github/workflows/release.yml \\
            --cert-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          ### Install
          Linux AppImage:
          \`\`\`bash
          curl -fsSL -o DeepCatalog.AppImage \\
            https://github.com/dpastoetter/DeepCatalog/releases/latest/download/DeepCatalog-${VERSION}-x86_64.AppImage
          chmod +x DeepCatalog.AppImage
          ./DeepCatalog.AppImage
          \`\`\`

          Linux / macOS (source + venv):
          \`\`\`bash
          curl -fsSL https://github.com/dpastoetter/DeepCatalog/releases/latest/download/install.sh | bash
          \`\`\`

          Windows (PowerShell):
          \`\`\`powershell
          irm https://github.com/dpastoetter/DeepCatalog/releases/latest/download/install.ps1 | iex
          \`\`\`
          EOF
          # Strip the common leading indent from the heredoc body.
          sed -i 's/^          //' /tmp/release-notes.md

          ASSETS=(
            dist/deepcatalog-"${VERSION}".tar.gz
            dist/DeepCatalog-"${VERSION}"-x86_64.AppImage
            dist/release-manifest.json
            dist/release-manifest.json.sig
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS
          )
          for asset in "${ASSETS[@]}"; do
            test -s "$asset"
          done

          # This workflow is the only publisher of official assets. Strip anything
          # a human or PAT already uploaded so a pre-populated release cannot survive.
          if gh release view "$TAG" >/dev/null 2>&1; then
            mapfile -t existing < <(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            for name in "${existing[@]}"; do
              if [ -n "$name" ]; then
                gh release delete-asset "$TAG" "$name" --yes
              fi
            done
            gh release upload "$TAG" "${ASSETS[@]}"
            gh release edit "$TAG" --draft=false --notes-file /tmp/release-notes.md --target "$COMMIT"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              --target "$COMMIT"
          fi
