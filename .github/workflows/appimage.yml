# Manual Linux AppImage build (Actions artifact only — never a GitHub Release).
# Official AppImages are published solely by the Release workflow after quality/security.

name: AppImage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Poppler, WebKitGTK, and AppImage build deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            poppler-utils patchelf gcc pkg-config meson ninja-build file \
            libgirepository1.0-dev libcairo2-dev gobject-introspection \
            gir1.2-gtk-3.0 libgtk-3-0 libffi-dev \
            adwaita-icon-theme gnome-themes-extra librsvg2-common \
            libgdk-pixbuf2.0-bin libgdk-pixbuf2.0-dev
          if ! sudo apt-get install -y -qq libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1; then
            sudo apt-get install -y -qq libwebkit2gtk-4.0-37 libwebkit2gtk-4.0-dev gir1.2-webkit2-4.0
          fi

      - name: Build AppImage
        run: |
          set -euo pipefail
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-appimage
          path: |
            dist/DeepCatalog-*-x86_64.AppImage
            dist/DeepCatalog-*-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 14
