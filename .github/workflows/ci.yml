# Pin GitHub Actions to full commit SHAs (immutable). Version comments help Dependabot.
# Resolve SHAs with: gh api repos/<owner>/<repo>/git/ref/tags/<tag>
# Security jobs live in security.yml (reusable) so PR and release share the same gates.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node (JS syntax + Vitest)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install Poppler and Tesseract (OCR tests)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install -e ".[dev]" -c constraints.txt
          npm ci

      - name: Run quality gate
        run: |
          set -euo pipefail
          chmod +x scripts/ci.sh
          ./scripts/ci.sh

  security:
    name: Security scans
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
