# Pin GitHub Actions to full commit SHAs (immutable). Version comments help Dependabot.
# Resolve SHAs with: gh api repos/<owner>/<repo>/git/ref/tags/<tag>
# Security jobs live in security.yml (reusable) so PR and release share the same gates.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node (JS syntax + Vitest)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install Poppler (PDF render tests)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install -e ".[dev]" -c constraints.txt
          npm ci

      - name: Run quality gate
        run: |
          set -euo pipefail
          chmod +x scripts/ci.sh
          ./scripts/ci.sh

  security:
    name: Security scans
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
