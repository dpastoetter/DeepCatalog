# Keep default gitleaks rules; only skip fixtures / lockfiles / example env.
title = "DeepCatalog"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures, lockfiles, example env, and the public release verify key"
paths = [
  '''(^|/)tests/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''package-lock\.json$''',
  '''constraints\.txt$''',
  '''\.env\.example$''',
  '''(^|/)docs/''',
]
# Embedded Ed25519 *public* key for release-manifest verification (not a secret).
# Listed by value so historical commits that introduced it are also allowed.
regexes = [
  '''5334cfc14c39e6e44f658109ba6bfa42c00ad6a340a8cf796337a6649c5c8b60''',
]
