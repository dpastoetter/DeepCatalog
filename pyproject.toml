[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcatalog"
version = "0.7.0"
description = "Deep document intelligence, local-first."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "google-adk>=2.0",
  "google-genai>=1.0",
  "openai>=1.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "chromadb>=0.5",
  "pypdf>=4.0",
  "python-dotenv>=1.0",
  "watchdog>=4.0",
  "pillow>=10.0",
  "pdf2image>=1.17",
  "httpx>=0.27",
  "httpcore>=1.0",
  "python-multipart>=0.0.9",
  "cryptography>=42",
]

[project.optional-dependencies]
desktop = [
  "pywebview>=5.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.8",
  "types-Pillow",
  "pip-tools>=7.4",
]

[tool.setuptools.packages.find]
include = ["deepcatalog*", "query_agent*", "app*"]

[tool.setuptools.package-data]
app = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["frontend", ".*", "node_modules"]
pythonpath = ["."]
addopts = [
  "--cov=deepcatalog",
  "--cov=app",
  "--cov=query_agent",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html",
  "--cov-fail-under=65",
]

[tool.coverage.run]
branch = true
source = ["deepcatalog", "app", "query_agent"]
omit = [
  "*/__main__.py",
  "deepcatalog/desktop.py",
  "deepcatalog/__init__.py",
  "app/__init__.py",
  "query_agent/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["deepcatalog", "app", "query_agent", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]
ignore = [
  "E501",
  "B008",
  "SIM102",
  "SIM103",
  "SIM105",
  "SIM108",
]

[tool.ruff.lint.isort]
known-first-party = ["deepcatalog", "query_agent", "app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
packages = ["deepcatalog", "app"]

[[tool.mypy.overrides]]
module = [
  "deepcatalog.llm",
  "deepcatalog.desktop",
]
ignore_errors = true
